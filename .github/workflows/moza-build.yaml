name: MOZA build (sync with upstream)

# Daily (and on demand): merge the latest upstream TelemFFB (walmis/VPforce-TelemFFB, branch
# "refactor") into this fork's "moza" branch in the runner, run the test suite, build the
# Windows package and publish it as a GitHub release of this fork.
#
# The merge is NOT pushed back (GITHUB_TOKEN cannot push upstream workflow-file changes);
# the moza branch is synced manually.  A merge conflict or failed tests fail the run, and
# GitHub e-mails the repository owner.
#
# MOZA_SDK.dll is intentionally NOT part of the build: the MOZA SDK carries no
# redistribution licence.  The local updater (moza/update_telemffb_moza.ps1) copies it in
# from the user's own MOZA SDK download.

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Build even if a release for this upstream+moza combination exists'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: moza-build
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.merge.outputs.tag }}
      version: ${{ steps.merge.outputs.version }}
      base: ${{ steps.merge.outputs.base }}
      upstream: ${{ steps.merge.outputs.upstream }}
      moza: ${{ steps.merge.outputs.moza }}
      skip: ${{ steps.merge.outputs.skip }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: moza
          fetch-depth: 0
      - name: Merge latest upstream
        id: merge
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE: ${{ inputs.force }}
        run: |
          git config user.name "moza-build"
          git config user.email "actions@users.noreply.github.com"
          git remote add upstream https://github.com/walmis/VPforce-TelemFFB.git
          git fetch --tags upstream refactor
          UP=$(git rev-parse --short=8 upstream/refactor)
          ME=$(git rev-parse --short=8 HEAD)
          git merge --no-edit upstream/refactor
          # upstream release this build is based on, e.g. 3.0.261019
          BASE=$(git describe --tags --abbrev=0 --match '[0-9]*.[0-9]*.[0-9]*' upstream/refactor 2>/dev/null || echo "dev")
          # version = <series from moza/VERSION>.<build number>, e.g. 0.1.3
          SERIES=$(tr -d ' \r\n' < moza/VERSION)
          KEY="upstream=${UP} moza=${ME}"
          LAST=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 200 --json tagName --jq '.[].tagName' \
                 | grep "^v${SERIES}\.[0-9]*$" | sed "s/^v${SERIES}\.//" | sort -n | tail -n 1 || true)
          if [ -n "$LAST" ] && [ "$FORCE" != "true" ] && \
             gh release view "v${SERIES}.${LAST}" --repo "$GITHUB_REPOSITORY" --json body --jq .body | grep -qF "$KEY"; then
            echo "v${SERIES}.${LAST} already contains $KEY - nothing new upstream."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
          VERSION="${SERIES}.$(( ${LAST:-0} + 1 ))"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "base=$BASE" >> "$GITHUB_OUTPUT"
          echo "upstream=$UP" >> "$GITHUB_OUTPUT"
          echo "moza=$ME" >> "$GITHUB_OUTPUT"
          echo "Next version: $VERSION (TelemFFB $BASE, $KEY)"

  test:
    needs: prepare
    if: needs.prepare.outputs.skip == 'false'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: moza
          fetch-depth: 0
      - name: Merge latest upstream
        shell: bash
        run: |
          git config user.name "moza-build"
          git config user.email "actions@users.noreply.github.com"
          git remote add upstream https://github.com/walmis/VPforce-TelemFFB.git
          git fetch --no-tags upstream refactor
          git merge --no-edit upstream/refactor
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Run pytest
        shell: pwsh
        run: |
          pytest -n auto
          $code = $LASTEXITCODE
          Write-Host ("pytest exit code: {0}" -f $code)
          exit $code
        env:
          PYTHONFAULTHANDLER: "1"
          PYTHONUNBUFFERED: "1"

  build:
    needs: [prepare, test]
    # native Windows runner (the upstream wine-based pyinstaller action fails on current runners)
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: moza
          fetch-depth: 0
      - name: Merge latest upstream
        run: |
          git config user.name "moza-build"
          git config user.email "actions@users.noreply.github.com"
          git remote add upstream https://github.com/walmis/VPforce-TelemFFB.git
          git fetch --no-tags upstream refactor
          git merge --no-edit upstream/refactor
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller
      - name: Create Version file
        run: |
          echo "VERSION = \"MOZA ${{ needs.prepare.outputs.version }} (TelemFFB ${{ needs.prepare.outputs.base }})\"" > version.py
          echo "RELEASE = False" >> version.py
      - name: Package Application
        run: pyinstaller --noconfirm VPforce-TelemFFB.spec
      - name: Make Zip
        run: |
          OUT=$(dirname "$(find dist -name 'VPforce-TelemFFB.exe' | head -n 1)")
          echo "package dir: $OUT"
          test -n "$OUT"
          test ! -e "$OUT/MOZA_SDK.dll"
          cp moza/INSTALL.txt moza/add_moza_sdk.ps1 "$OUT/"
          7z a -tzip "TelemFFB-MOZA-${{ needs.prepare.outputs.version }}.zip" "./$OUT/*" > /dev/null
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ needs.prepare.outputs.tag }}"
          VERSION="${{ needs.prepare.outputs.version }}"
          BASE="${{ needs.prepare.outputs.base }}"
          UP="${{ needs.prepare.outputs.upstream }}"
          ME="${{ needs.prepare.outputs.moza }}"
          # --- what changed since the previous release (its notes carry the build key) ---
          PREV_BODY=$(gh release view --repo "$GITHUB_REPOSITORY" --json body --jq .body 2>/dev/null || true)
          PUP=$(echo "$PREV_BODY" | sed -n 's/.*upstream=\([0-9a-f]\{8\}\).*/\1/p' | head -n 1)
          PME=$(echo "$PREV_BODY" | sed -n 's/.*moza=\([0-9a-f]\{8\}\).*/\1/p' | head -n 1)
          {
            echo "## Changes"
            echo
            echo "**MOZA (this fork):**"
            if [ -n "$PME" ] && git cat-file -e "$PME" 2>/dev/null; then
              L=$(git log --no-merges --format='- %s' "$PME..$ME" -- . ':!.github' | head -n 30)
            else
              L=$(git log --no-merges --format='- %s' upstream/refactor..$ME | head -n 30)
            fi
            echo "${L:-- no changes}"
            echo
            echo "**TelemFFB (upstream walmis/VPforce-TelemFFB):**"
            if [ -n "$PUP" ] && git cat-file -e "$PUP" 2>/dev/null; then
              L=$(git log --no-merges --format='- %s' "$PUP..$UP" | head -n 40)
              N=$(git rev-list --no-merges --count "$PUP..$UP")
              [ "$N" -gt 40 ] && L="$L"$'\n'"- ... and $((N-40)) more"
            else
              L="- first build on TelemFFB ${BASE}"
            fi
            echo "${L:-- no changes}"
            echo
          } > changes.md
          cat changes.md
          cat > notes.md <<EOF
          TelemFFB MOZA ${VERSION}, based on TelemFFB ${BASE}: TelemFFB with the MOZA SDK backend
          (effects work in the MOZA base's Force Sensing mode).

          $(cat changes.md)

          Build key: upstream=${UP} moza=${ME}

          Installation: see INSTALL.txt inside the zip.

          MOZA_SDK.dll is not included (no redistribution licence). Install with
          moza/update_telemffb_moza.ps1, which adds it from your own MOZA SDK download.
          Licence: GPL-3.0 (see COPYING.txt); source: this repository, branch "moza".
          EOF
          gh release create "$TAG" "TelemFFB-MOZA-$VERSION.zip" --repo "$GITHUB_REPOSITORY" \
             --target moza --title "TelemFFB MOZA $VERSION (TelemFFB $BASE)" --notes-file notes.md --latest
